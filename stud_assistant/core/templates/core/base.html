{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{% block title %}StudAssistant{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block body %}
      <div class="container">
        <div class="surface" style="padding: var(--space-8);">
          {% block content %}{% endblock %}
        </div>
      </div>
    {% endblock %}
  </body>
</html>
