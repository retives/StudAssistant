{% extends "core/base.html" %}
{% load static %}

{% block body %}
<div class="app-shell" id="appShell">
  <aside class="sidebar" id="sidebar">
    <div class="brand" style="margin-bottom: var(--space-6);">
      <div style="display:flex; align-items:center; justify-content:space-between; gap: var(--space-3);">
        <div class="brand-title" id="brandTitle">StudAssistant</div>
        <button class="btn btn-ghost" type="button" id="sidebarToggle" aria-label="Toggle sidebar" aria-expanded="true">
          ☰
        </button>
      </div>
      <div class="brand-subtitle">Your chats</div>
    </div>

    <nav class="chat-nav">
      {% for c in chats %}
        <a
          class="chat-link {% if active_chat and c.id == active_chat.id %}is-active{% endif %}"
          href="{% url 'chat_page' chat_id=c.id %}"
          title="{{ c.name }}"
        >
          <div class="chat-link-title">{{ c.name }}</div>
          <div class="chat-link-meta">{{ c.last_updated|date:"M j, H:i" }}</div>
        </a>
      {% empty %}
        <div class="muted" style="color: rgba(226, 232, 240, 0.75);">No chats yet.</div>
      {% endfor %}
    <form method="post">
        {% csrf_token %}
        <input type="submit" value="Create Chat">
    </form>


    </nav>
  </aside>

  <main class="main">
    {% block main %}{% endblock %}
  </main>
</div>

<script>
  (function () {
    const shell = document.getElementById("appShell");
    const toggle = document.getElementById("sidebarToggle");
    const key = "studassistant.sidebarCollapsed";
    
    function setCollapsed(collapsed) {
      shell.classList.toggle("is-collapsed", collapsed);
      toggle.setAttribute("aria-expanded", String(!collapsed));
      try { localStorage.setItem(key, collapsed ? "1" : "0"); } catch (e) {}
    }

    let initial = false;
    try { initial = localStorage.getItem(key) === "1"; } catch (e) {}
    setCollapsed(initial);

    toggle.addEventListener("click", function () {
      setCollapsed(!shell.classList.contains("is-collapsed"));
    });

    const log = document.getElementById("chatLog");
    if (log) log.scrollTop = log.scrollHeight;
  })();
</script>
{% endblock %}
